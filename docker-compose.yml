services:
  db:
    image: postgres:15-alpine
    container_name: voice-ai-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: voice-ai-db
      POSTGRES_DB: ai_voice_app
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: redis_ai_service
    restart: always
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --bind 0.0.0.0
      --protected-mode yes
      --requirepass "359E5eNLhR9c5WdxVk0w6Lu4cBWGGn0c"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: voice-ai-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      HOST_DB: db
      PORT_DB: 5432
      NAME_DB: ai_voice_app
      USER_DB: admin
      PASS_DB: voice-ai-db
      HOST_REDIS: redis
      PORT_REDIS: 6379
      PASS_REDIS: "359E5eNLhR9c5WdxVk0w6Lu4cBWGGn0c"
      AUTH_TOKEN: aNbCfe1ja31FhnbpvFN4/OAvLpyu1mDyKQYvuls9Ptg=
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  redis_data:
  qdrant:
  uploads_data: